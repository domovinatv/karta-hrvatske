# Cloudflare Workers (static assets) config za gis.domovina.ai
#
# Isti worker kao na Pagesu: public/_worker.js. Vite ga kopira u dist/, gdje ga
# Pages (Advanced Mode) pokreće sam, a ovdje ga wrangler bundla kao `main`.
# public/.assetsignore drži ga izvan javnih asseta.
#
# Deploy: scripts/deploy.sh (DEPLOY_TARGET=worker | pages). `wrangler pages
# deploy` ovaj file preskače jer nema pages_build_output_dir.

name = "gis-domovina"
main = "public/_worker.js"
compatibility_date = "2025-10-01"
account_id = "7dc7167b7e2e00923bfa7cd697df14e4"
workers_dev = true
# Route ispred Pages custom domene: zahtjevi na gis.domovina.ai idu u ovaj
# Worker, Pages projekt ostaje iza kao rezerva. Povratak na Pages = makni
# route i `npx wrangler deploy` (ili obriši route u dashboardu).
routes = [{ pattern = "gis.domovina.ai/*", zone_name = "domovina.ai" }]

[assets]
directory = "./dist"
binding = "ASSETS"
# Worker hendla HTML rute: OG, sadržaj za #root, SPA fallback. Statičke
# datoteke (hashirani bundle, geojsoni, indeks pretrage, logotipi) idu ravno
# iz asseta: takav zahtjev ne pokreće Worker, pa se ne broji u kvotu
# poziva i trošak ne raste s brojem posjetitelja. Headere za njih daje
# public/_headers. Vidi docs/2026-10-30-trazilica.md (Troškovi).
run_worker_first = ["/*", "!/assets/*", "!/data/*", "!/logos/*", "!/icons/*"]
# ASSETS.fetch za nepostojeći path vraća index.html — isto kao Pages; worker
# za file-like putanje to pretvara u 404 no-store.
not_found_handling = "single-page-application"

[observability]
enabled = true

[vars]
# Worker postavlja X-Runtime: worker — vidi se tko je odgovorio (Pages nema var).
RUNTIME = "worker"
