<!doctype html>
<html lang="hr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#002F6C" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
    <!--META-->
    <title>DOMOVINA Karta — Geografija Hrvatske</title>

      name="description"
      content="Interaktivna karta Republike Hrvatske — 556 JLS, 6759 naselja, 901 nogometni klub. Otvoreni podaci, $0 vendor."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DOMOVINA Karta — Geografija Hrvatske" />

      property="og:description"
      content="Interaktivna karta RH s 556 JLS, 6759 naselja i 901 nogometnim klubom."
    />
    <script>
      // No-FOUC theme sync before CSS paints. Default: dark.
      try {
        const t = localStorage.getItem("domovina-theme");
        if (t === "light") document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
  </head>
